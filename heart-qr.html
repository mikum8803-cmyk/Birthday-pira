<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart QR — Ndoro Ratu Pira</title>
<style>body{margin:0;min-height:100vh;background:#08050a;color:#f8edf6;font-family:system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);padding:28px;border:1px solid #54243f;border-radius:28px;background:#120812;text-align:center;box-shadow:0 30px 100px #000}h1{font-family:Georgia,serif;font-size:42px;margin:0 0 8px}p{color:#bcaeba;line-height:1.6}input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid #54243f;background:#08050a;color:white;outline:none}button{margin-top:14px;padding:12px 18px;border-radius:999px;border:1px solid #7b315b;background:#ff5fbd;color:#220616;font-weight:700;cursor:pointer}#qr{margin:24px auto;padding:18px;width:max-content;background:white;border-radius:26px;position:relative}#qr:after{content:"♡";position:absolute;inset:0;display:grid;place-items:center;color:#ff5fbd;font-size:30px;font-weight:900;mix-blend-mode:multiply;pointer-events:none}small{color:#806f7d}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div class="card"><h1>♡ Heart QR</h1><p>Masukkan link publik website birthday setelah website di-host. QR ini akan mengarah langsung ke website tersebut.</p><input id="url" placeholder="https://contoh.com/birthday-pira"><button id="make">Buat QR</button><div id="qr"></div><small>Uji scan QR dengan HP sebelum dicetak.</small></div>
<script>const input=document.querySelector("#url"),box=document.querySelector("#qr");document.querySelector("#make").onclick=()=>{const value=input.value.trim();if(!/^https?:\/\//i.test(value)){alert("Masukkan URL lengkap, misalnya https://...");return}box.innerHTML="";new QRCode(box,{text:value,width:220,height:220,colorDark:"#160814",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});};</script></body></html>
